services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vpcraft-api:local
    container_name: vpcraft-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      AWS_REGION: ${AWS_REGION:-not-deployed}
      INSTANCE_ID: ${INSTANCE_ID:-}
      INSTANCE_TYPE: ${INSTANCE_TYPE:-}
      AVAILABILITY_ZONE: ${AVAILABILITY_ZONE:-}
      PUBLIC_IP: ${PUBLIC_IP:-}
      DATABASE_PATH: /data/vpcraft.db
    expose:
      - "8000"
    volumes:
      - vpcraft-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: nginx:1.28-alpine
    container_name: vpcraft-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  vpcraft-data:
